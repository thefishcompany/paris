<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Street Walk - 1인칭 실사 산책</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Apple SD Gothic Neo', sans-serif; }
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; background: rgba(0,0,0,0.85); padding: 40px;
            border-radius: 20px; cursor: pointer; z-index: 10; border: 1px solid #555;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #ui h1 { margin: 0 0 15px 0; color: #f0db4f; font-size: 24px; }
        #ui p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>파리 도보 산책</h1>
        <p>화면을 클릭하면 파리 거리로 들어갑니다</p>
        <p style="margin-top:20px;">[ W, A, S, D ] 이동</p>
        <p>[ 마우스 ] 시선 돌리기</p>
    </div>
    <div class="crosshair"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
            "@lumaai/luma-web": "https://unpkg.com/@lumaai/luma-web@0.2.0/dist/library/luma-web.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { LumaSplatsThree } from '@lumaai/luma-web';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 1인칭 눈높이 설정 (1.6m)
        const eyeHeight = 1.6;
        camera.position.set(0, eyeHeight, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 실제 파리 거리 데이터 (Rue de l'Abreuvoir)
        const splat = new LumaSplatsThree({
            source: 'https://lumalabs.ai/capture/d80d1962-f19b-43d7-846f-c179c38f1588'
        });
        scene.add(splat);

        const controls = new PointerLockControls(camera, document.body);
        const ui = document.getElementById('ui');

        ui.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => ui.style.display = 'none');
        controls.addEventListener('unlock', () => ui.style.display = 'block');

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let walkTime = 0; // 머리 흔들림 계산용

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyD') moveRight = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyD') moveRight = false;
        });

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                const moveSpeed = 0.05;
                
                // 이동 처리
                if (moveForward) controls.moveForward(moveSpeed);
                if (moveBackward) controls.moveForward(-moveSpeed);
                if (moveLeft) controls.moveRight(-moveSpeed);
                if (moveRight) controls.moveRight(moveSpeed);

                // --- 실제 같은 1인칭 효과 (Head Bobbing) ---
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    walkTime += 0.15; // 걷는 속도에 맞춘 리듬
                    // 위아래로 살짝 흔들림
                    camera.position.y = eyeHeight + Math.sin(walkTime) * 0.03;
                } else {
                    // 가만히 있을 때 천천히 원래 높이로
                    camera.position.y += (eyeHeight - camera.position.y) * 0.1;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
